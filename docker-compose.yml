services:
  db:
    image: postgres:16-alpine
    container_name: guanar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: guanar
      POSTGRES_PASSWORD: guanar
      POSTGRES_DB: guanar
    ports:
      - "5432:5432"
    volumes:
      - guanar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guanar -d guanar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guanar-db-data:
